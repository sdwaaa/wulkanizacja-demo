var(--accent-dark, #ff8a4c);--ok: #4cc38a;--danger: #ff6b5e}}*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:16px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}body{margin:0;font:17px/1.55 var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}a{color:var(--accent-ink);text-underline-offset:3px}:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px;border-radius:6px}.wrap{max-width:760px;margin:0 auto;padding:0 16px}.display{font-family:var(--display);font-stretch:118%;letter-spacing:-.01em}.muted{color:var(--ink-2)}.num{font-variant-numeric:tabular-nums}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;font:600 17px/1 var(--body);text-decoration:none;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);transition:transform .12s ease,background .15s ease}.btn:active{transform:scale(.98)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn:disabled{opacity:.55;cursor:default}

</style></head> <body> <main class="wrap visit"> <p><a href="/wulkanizacja-demo/twr/">← Wulkanizacja TWR</a></p> <h1 class="display">Moja wizyta</h1> <div class="card" id="box"><p class="muted">Wczytuję…</p></div> <p class="muted center">Pytania? <a href="tel:+48692039900">+48 692 039 900</a></p> </main> <script>(function(){const api = "/api/api.php";
const address = "ul. Urocza 48, 61-601 Poznań";
const base = "/wulkanizacja-demo/twr";
const demo = true;

    const box = document.getElementById('box');
    const t = new URLSearchParams(location.search).get('t') || '';
    const STATUS = { new: ['Zarezerwowana', 'ok'], confirmed: ['Potwierdzona', 'ok'], rejected: ['Odrzucona', 'off'], cancelled: ['Odwołana', 'off'] };
    // tryb demo: rezerwacja leży w localStorage tego telefonu
    const key = 'wizyta:' + t;
    const demoGet = () => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } };
    async function load() {
      let b;
      if (demo) {
        b = demoGet();
        if (!b) { box.innerHTML = '<p class="error">Nie znaleziono rezerwacji na tym telefonie (wersja demo).</p>'; return; }
      } else {
        const r = await fetch(api + '?action=booking&t=' + encodeURIComponent(t));
        b = await r.json();
        if (!r.ok) { box.innerHTML = `<p class="error">${b.error}</p>`; return; }
      }
      const when = new Date(b.start.replace(' ', 'T'));
      const active = (b.status === 'new' || b.status === 'confirmed') && when > new Date();
      const [label, cls] = STATUS[b.status];
      box.innerHTML = `<span class="badge ${cls}">${label}</span>
        <p class="when display num">${when.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' })}<br>${b.start.slice(11)}</p>
        <ul class="facts"><li><span>Felga</span><b>${b.size}″</b></li><li><span>Cena</span><b class="num">${b.price} zł</b></li><li><span>Adres</span><b>${address}</b></li></ul>
        ${active ? '<div class="actions"><button class="btn" id="move">Zmień termin</button><button class="btn danger" id="cancel">Odwołaj wizytę</button></div>' : ''}
        <p class="error" id="err"></p>`;
      if (!active) return;
      const cancel = async () => {
        if (demo) { try { localStorage.setItem(key, JSON.stringify({ ...demoGet(), status: 'cancelled' })); } catch {} return true; }
        const r = await fetch(api + '?action=cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t }) });
        const j = await r.json();
        if (!r.ok) { document.getElementById('err').textContent = j.error; return false; }
        return true;
      };
      document.getElementById('cancel').onclick = async () => {
        if (confirm('Odwołać wizytę? Termin zwolni się dla innych klientów.') && await cancel()) load();
      };
      document.getElementById('move').onclick = async () => {
        if (confirm('Obecny termin zostanie zwolniony, a nowy wybierzesz na stronie głównej.') && await cancel()) location.href = base + '/#rezerwacja';
      };
    }
    load().catch(() => { box.innerHTML = '<p class="error">Nie udało się wczytać rezerwacji. Zadzwoń do nas.</p>'; });
  })();</script>  </body> </html>
